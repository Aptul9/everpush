name: Rollback

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Previous release, or disable EverPush and remove its route
        required: true
        default: previous
        type: choice
        options: [previous, disable]

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: SSH configuration
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Run versioned rollback
        run: |
          case "$OPERATION" in previous|disable) ;; *) exit 1 ;; esac
          ssh "$TARGET" "bash -s -- '$OPERATION'" < ci/rollback.sh
